name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # infra 워크스페이스의 postinstall(cdktf get)이 바인딩 생성을 위해 Terraform CLI를
      # 필요로 한다 (타입체크가 infra까지 포함하므로 이 잡만 실제로 필요하다).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: npm ci
      - run: npm run typecheck

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # eslint는 type-aware 설정이 아니라 생성된 Prisma Client/cdktf 바인딩이 필요 없다.
      # 두 워크스페이스의 postinstall(prisma generate/cdktf get)을 건너뛰어 불필요한
      # 실패 지점(Terraform CLI 부재 등)을 없앤다.
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace=backend

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace=frontend

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 테스트는 실제로 @prisma/client를 임포트하므로 backend만 generate한다.
      # infra의 cdktf get(Terraform CLI 필요)은 이 잡과 무관하므로 건너뛴다.
      - run: npm ci --ignore-scripts
      # auth.service.spec.ts가 auth.service.ts → user.service.ts를 거쳐 실제 bcrypt를
      # import한다. --ignore-scripts가 bcrypt의 네이티브 바인딩 설치(node-pre-gyp)도
      # 건너뛰어 MODULE_NOT_FOUND로 죽는다 (test-e2e job과 동일한 원인).
      - run: npm rebuild bcrypt
      - run: npm run prisma:generate --workspace=backend
      - run: npm run test --workspace=backend

  test-e2e:
    name: Test (E2E)
    # 별도 배포 파이프라인이 없어 배포는 수동(npm run deploy)이다. "배포 전에만
    # 돈다"(.claude/docs/decisions/013-e2e-vs-frontend-integration-test.md)는 원칙을
    # 실제 트리거로 옮기면 "main에 push된 시점(=머지 직후, 배포 직전)"이 가장 가까운
    # 대리 신호다. PR마다 돌리면 매번 실제 Postgres+백엔드를 띄워야 해서 PR 피드백
    # 루프가 느려지므로 push에서만 실행한다.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: petlog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # auth.controller.ts는 NODE_ENV==='production'일 때만 쿠키에 secure를 켠다.
      # CI는 http://localhost로 접속하므로 production으로 두면 브라우저가 Secure
      # 쿠키를 버려 로그인 자체가 깨진다.
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/petlog
      JWT_SECRET: ci-e2e-access-secret
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_SECRET: ci-e2e-refresh-secret
      REFRESH_TOKEN_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_USE_MOCK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # --ignore-scripts는 infra 워크스페이스의 postinstall(cdktf get, Terraform CLI
      # 필요)을 피하려는 목적인데(다른 test/lint job과 동일), 그 부작용으로 bcrypt의
      # install 스크립트(node-pre-gyp, 네이티브 바인딩 설치)도 건너뛰어 백엔드 서버
      # 기동 시 MODULE_NOT_FOUND로 죽는다. bcrypt만 콕 집어 rebuild한다.
      - run: npm rebuild bcrypt
      - run: npm run prisma:generate --workspace=backend
      - name: Run database migrations
        working-directory: backend
        run: npx prisma migrate deploy
      # backend는 @petlog/ai, @petlog/mail, @petlog/push, @petlog/storage 등 워크스페이스
      # libs를 참조하는데, TypeScript project reference(tsconfig.base.json)라 libs를
      # 먼저 tsc --build로 컴파일해 dist/*.d.ts를 만들어두지 않으면 `nest build`가
      # TS6305로 실패한다 (backend/Dockerfile의 빌드 순서와 동일하게 맞춘다).
      - run: npx tsc --build libs/types libs/utils libs/ai libs/storage libs/mail libs/push
      - run: npm run build --workspace=backend
      - name: Start backend
        working-directory: backend
        # PORT는 이 스텝에만 한정한다 — job 레벨 env에 두면 frontend의 `next start`도
        # 이 값을 이어받아 4000번으로 붙으려다 backend와 EADDRINUSE로 충돌한다
        # (Next CLI가 -p 미지정 시 process.env.PORT를 기본값으로 쓰기 때문).
        env:
          PORT: '4000'
        run: nohup npm start > /tmp/backend.log 2>&1 &
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/api/health && exit 0
            sleep 2
          done
          echo "backend did not become ready in time"; cat /tmp/backend.log; exit 1
      - run: npm run build --workspace=frontend
      - name: Start frontend
        working-directory: frontend
        run: nohup npm start > /tmp/frontend.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && exit 0
            sleep 2
          done
          echo "frontend did not become ready in time"; cat /tmp/frontend.log; exit 1
      - name: Install Playwright Browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build-backend:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # workspaces 모노레포에서 backend/Dockerfile이 libs/* 패키지 추가를 누락하면
      # (COPY 대상, tsc --build 대상) 배포 시점에야 발견된다. PR 단계에서 미리 잡는다.
      - run: docker build -f backend/Dockerfile -t petlog-backend:ci .

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile -t petlog-frontend:ci .

  sync-mobile:
    name: Capacitor Sync (Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      # 비밀 값이 아니라 배포 도메인이므로 Secrets가 아닌 Repository Variable로 등록한다
      # (Settings > Secrets and variables > Actions > Variables > MOBILE_APP_URL).
      # infra/stacks/backend-stack.ts의 domain_name과 동일하게 코드-설정을 분리하는 목적이다.
      MOBILE_APP_URL: ${{ vars.MOBILE_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # cap sync는 backend/infra 워크스페이스와 무관하므로 postinstall(prisma
      # generate/cdktf get)을 건너뛴다.
      - run: npm ci --ignore-scripts
      - run: npm run sync:android --workspace=mobile
