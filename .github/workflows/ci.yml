name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # infra 워크스페이스의 postinstall(cdktf get)이 바인딩 생성을 위해 Terraform CLI를
      # 필요로 한다 (타입체크가 infra까지 포함하므로 이 잡만 실제로 필요하다).
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: npm ci
      - run: npm run typecheck

  lint-backend:
    name: Lint (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # eslint는 type-aware 설정이 아니라 생성된 Prisma Client/cdktf 바인딩이 필요 없다.
      # 두 워크스페이스의 postinstall(prisma generate/cdktf get)을 건너뛰어 불필요한
      # 실패 지점(Terraform CLI 부재 등)을 없앤다.
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace=backend

  lint-frontend:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint --workspace=frontend

  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 테스트는 실제로 @prisma/client를 임포트하므로 backend만 generate한다.
      # infra의 cdktf get(Terraform CLI 필요)은 이 잡과 무관하므로 건너뛴다.
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate --workspace=backend
      - run: npm run test --workspace=backend

  docker-build-backend:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # workspaces 모노레포에서 backend/Dockerfile이 libs/* 패키지 추가를 누락하면
      # (COPY 대상, tsc --build 대상) 배포 시점에야 발견된다. PR 단계에서 미리 잡는다.
      - run: docker build -f backend/Dockerfile -t petlog-backend:ci .

  docker-build-frontend:
    name: Docker Build (Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f frontend/Dockerfile -t petlog-frontend:ci .

  sync-mobile:
    name: Capacitor Sync (Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    env:
      # 비밀 값이 아니라 배포 도메인이므로 Secrets가 아닌 Repository Variable로 등록한다
      # (Settings > Secrets and variables > Actions > Variables > MOBILE_APP_URL).
      # infra/stacks/backend-stack.ts의 domain_name과 동일하게 코드-설정을 분리하는 목적이다.
      MOBILE_APP_URL: ${{ vars.MOBILE_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # cap sync는 backend/infra 워크스페이스와 무관하므로 postinstall(prisma
      # generate/cdktf get)을 건너뛴다.
      - run: npm ci --ignore-scripts
      - run: npm run sync:android --workspace=mobile
